name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 说明：GitHub 默认 runner 已切换到 ubuntu-26.04，而 Python 3.9–3.13
          # 在 actions/python-versions 中没有 26.04 的 linux/x64 构建
          # （3.9 仅有 20.04 / 22.04 / 24.04），故显式指定 ubuntu-24.04。
          # 3.9 已进入 EOL，若未来移除该构建可直接删掉对应条目。
          - { python-version: "3.9",  os: "ubuntu-24.04" }
          - { python-version: "3.10", os: "ubuntu-24.04" }
          - { python-version: "3.11", os: "ubuntu-24.04" }
          - { python-version: "3.12", os: "ubuntu-24.04" }
          - { python-version: "3.13", os: "ubuntu-24.04" }

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile all sources
        run: python -m compileall -q src skill/scripts

      - name: Import smoke test
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'src')
          import wb_quota_guard
          from wb_quota_guard import core, report, cli
          assert wb_quota_guard.__version__
          assert callable(cli.main)
          assert 'ERROR_CODES' in dir(core)
          assert '6004' in core.ERROR_CODES
          print('import OK', wb_quota_guard.__version__)
          "

      - name: CLI help works
        run: PYTHONPATH=src python -m wb_quota_guard --help

      - name: Skill entrypoint works
        run: python skill/scripts/quota_guard.py --help

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          wb-quota-guard --help

      - name: Unit tests
        run: python tests/test_calibration.py

  node:
    name: Hook syntax check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check hook
        run: node --check hooks/quota-precheck.js

  hygiene:
    name: Privacy hygiene
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Repository hygiene check
        # 检查项：本地产物未入库 / 无本机绝对路径 / 无账号 UUID / 无密钥字面量
        # 详见 scripts/hygiene_check.py 顶部说明
        run: python scripts/hygiene_check.py

  calibration:
    name: Calibration data
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Calibration pool check
        # 检查项：样本 schema 校验 / 隐私扫描 / 聚合可执行 / 参考表与样本集一致
        # 详见 scripts/calibration_check.py 顶部说明
        run: python scripts/calibration_check.py
