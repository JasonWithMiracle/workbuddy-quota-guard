name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile all sources
        run: |
          python -m compileall -q src skill/scripts

      - name: Import smoke test
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'src')
          import wb_quota_guard
          from wb_quota_guard import core, report, cli
          assert wb_quota_guard.__version__
          assert callable(cli.main)
          assert 'ERROR_CODES' in dir(core)
          assert '6004' in core.ERROR_CODES
          print('import OK', wb_quota_guard.__version__)
          "

      - name: CLI help works
        run: |
          PYTHONPATH=src python -m wb_quota_guard --help

      - name: Skill entrypoint works
        run: |
          python skill/scripts/quota_guard.py --help

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          wb-quota-guard --help

  node:
    name: Hook syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check hook
        run: node --check hooks/quota-precheck.js

  hygiene:
    name: Privacy hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure no local artifacts are committed
        run: |
          for f in limits.json status.json handoff.md quota_report.html; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error::local artifact committed: $f"
              exit 1
            fi
          done
      - name: Ensure no personal paths in tracked source
        run: |
          if git grep -nIE 'C:\\\\Users|/Users/[a-z]|JasonWithMiracle|097bc327' -- src skill hooks docs; then
            echo "::error::personal identifier found in tracked source"
            exit 1
          fi
          echo "clean"
